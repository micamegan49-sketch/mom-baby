<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ดาวน์โหลดแอปตัวจิ๋ว</title>
  <link rel="icon" type="image/png" href="icons/favicon.png" />
  <!-- แคมเปญ "กระเป๋าคุณแม่ฟรี" จบแล้ว — หน้านี้กลายเป็นหน้าดาวน์โหลดแทน
       (ยังเก็บ path เดิมไว้ เพราะมีลิงก์เก่าในริชเมนู LINE / โพสต์เก่าชี้มาที่นี่) -->
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,"Sukhumvit Set","Noto Sans Thai",sans-serif;color:#3d2e26;
      background:linear-gradient(165deg,#FBF2EB,#F7E9E0 55%,#F3DCE0);min-height:100vh;
      padding:34px 18px 44px;max-width:520px;margin:0 auto;text-align:center}
    .logo{width:104px;height:104px;border-radius:28px;object-fit:cover;
      box-shadow:0 10px 28px rgba(139,94,75,.20)}
    h1{color:#8B5E4B;font-size:26px;margin:16px 0 6px}
    .sub{color:#a07a66;font-size:15px;line-height:1.6;margin-bottom:26px}
    a.btn{display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;
      font-weight:700;font-size:16.5px;padding:15px;border-radius:15px;margin:11px 0;
      background:#fff;color:#8B5E4B;box-shadow:0 6px 18px rgba(139,94,75,.15)}
    a.btn.ghost{background:rgba(255,255,255,.45);box-shadow:none;border:1.5px solid #E7D5C8}
    a.btn.line{background:#06C755;color:#fff}
    .note{font-size:12.5px;color:#a08877;margin-top:20px;line-height:1.7}
    .note a{color:#8B5E4B}
  </style>
</head>
<body>
  <img class="logo" src="icons/icon-192.png" alt="ตัวจิ๋ว" />
  <h1>ตัวจิ๋ว</h1>
  <div class="sub">แอปดูแลคุณแม่และลูกน้อย ฝีมือคนไทย<br />
    ตั้งครรภ์ · วัคซีน · พัฒนาการ · บันทึกประจำวัน<br />
    <b>ฟรี ไม่มีโฆษณา ไม่ต้องสมัครสมาชิก</b></div>

  <a class="btn" id="ios" href="https://apps.apple.com/app/id6783621193">🍎 ดาวน์โหลดบน App Store</a>
  <a class="btn" id="android" href="https://play.google.com/store/apps/details?id=app.tuajiw.mombaby">🤖 ดาวน์โหลดบน Google Play</a>
  <a class="btn ghost" href="https://tuajiw.com/">🌐 ใช้บนเว็บเลย (ไม่ต้องติดตั้ง)</a>
  <a class="btn line" href="https://line.me/R/ti/p/@777ssxzo">💬 แอดไลน์ ตัวจิ๋ว</a>

  <div class="note">
    ข้อมูลทั้งหมดเก็บอยู่ในเครื่องของคุณแม่เอง 🔒<br />
    <a href="privacy.html">ความเป็นส่วนตัว</a> · <a href="support.html">ช่วยเหลือ</a>
  </div>

  <script>
    // เครื่อง Android ให้ปุ่ม Play ขึ้นก่อน
    if (/Android/i.test(navigator.userAgent || '')) {
      var a = document.getElementById('android');
      a.parentNode.insertBefore(a, document.getElementById('ios'));
    }
  </script>
</body>
</html>
